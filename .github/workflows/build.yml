name: 桌面测试与安装包
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 原生检查 · ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: mac-arm64
          - os: macos-15-intel
            platform: mac-intel
          - os: windows-2022
            platform: windows-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: check-${{ matrix.platform }}
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked --tests

  bundle:
    name: 打包 · ${{ matrix.artifact }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundles: app,dmg
            artifact: mac-universal-test
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
            bundles: nsis
            artifact: windows-x64-test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: bundle-${{ matrix.target }}
      - run: npm ci
      - run: npm run package -- --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/nsis/*setup.exe
          if-no-files-found: error
          retention-days: 14

  installed:
    name: 安装后检查 · ${{ matrix.platform }}
    needs: bundle
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: mac-arm64
            artifact: mac-universal-test
          - os: macos-15-intel
            platform: mac-intel
            artifact: mac-universal-test
          - os: windows-2022
            platform: windows-x64
            artifact: windows-x64-test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: installer
      - name: 安装并检查只读 CLI
        run: node scripts/ci-install-smoke.mjs --artifact-dir installer --report reports/${{ matrix.platform }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installed-${{ matrix.platform }}
          path: reports/*.json
          if-no-files-found: error
          retention-days: 14
